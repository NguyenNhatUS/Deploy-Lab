spring.config.import=file:./.env[.properties]

spring.application.name=deploy-lab
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/deploy_lab?connectionTimeZone=UTC}
spring.datasource.username=${DB_USERNAME:deploy_lab}
spring.datasource.password=${DB_PASSWORD}

# Convenient for the first lab. Use versioned migrations in later deployment labs.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.access=read-only

server.error.include-message=never
server.error.include-stacktrace=never
